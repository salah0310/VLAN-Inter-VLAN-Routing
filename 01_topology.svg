<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="devGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4b5563"/>
      <stop offset="1" stop-color="#1f2937"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
    <g id="pc">
      <rect x="-28" y="-26" width="56" height="38" rx="4" fill="#111827" stroke="#374151" stroke-width="2"/>
      <rect x="-23" y="-21" width="46" height="28" rx="2" fill="#e5e7eb"/>
      <rect x="-6" y="12" width="12" height="7" fill="#6b7280"/>
      <rect x="-18" y="19" width="36" height="5" rx="2" fill="#374151"/>
    </g>
  </defs>

  <rect width="1000" height="660" fill="#ffffff"/>

  <!-- Title -->
  <text x="500" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">Inter-VLAN Routing - Router-on-a-Stick</text>
  <text x="500" y="60" text-anchor="middle" font-size="13" fill="#6b7280">Cisco 2911 · Catalyst 2960-24TT · VLAN 10 (IT) / VLAN 20 (SALES)</text>

  <!-- VLAN zones -->
  <rect x="40" y="380" width="440" height="230" rx="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <rect x="520" y="380" width="440" height="230" rx="14" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>

  <text x="60" y="406" font-size="15" font-weight="700" fill="#075985">VLAN 10 - IT</text>
  <rect x="70" y="562" width="380" height="36" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
  <text x="260" y="577" text-anchor="middle" font-size="14" font-weight="700" fill="#0c4a6e">Réseau : 192.168.10.0/24</text>
  <text x="260" y="592" text-anchor="middle" font-size="14" font-weight="700" fill="#0c4a6e">Passerelle (Gateway) : 192.168.10.1</text>

  <text x="540" y="406" font-size="15" font-weight="700" fill="#854d0e">VLAN 20 - SALES</text>
  <rect x="550" y="562" width="380" height="36" rx="8" fill="#ffffff" stroke="#ca8a04" stroke-width="2"/>
  <text x="740" y="577" text-anchor="middle" font-size="14" font-weight="700" fill="#713f12">Réseau : 192.168.20.0/24</text>
  <text x="740" y="592" text-anchor="middle" font-size="14" font-weight="700" fill="#713f12">Passerelle (Gateway) : 192.168.20.1</text>

  <!-- Links: router - switch (trunk) -->
  <line x1="500" y1="140" x2="500" y2="220" stroke="#dc2626" stroke-width="4"/>
  <text x="512" y="156" font-size="12" font-weight="600" fill="#374151">Gi0/0</text>
  <text x="512" y="212" font-size="12" font-weight="600" fill="#374151">Gi0/1</text>
  <rect x="512" y="168" width="96" height="22" rx="11" fill="#fee2e2" stroke="#dc2626"/>
  <text x="560" y="183" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b91c1c">TRUNK 802.1Q</text>

  <!-- Links: switch - PCs -->
  <g stroke-width="3" stroke-linecap="round">
    <line x1="455" y1="270" x2="150" y2="455" stroke="#0284c7"/>
    <line x1="470" y1="272" x2="370" y2="455" stroke="#0284c7"/>
    <line x1="530" y1="272" x2="630" y2="455" stroke="#ca8a04"/>
    <line x1="545" y1="270" x2="850" y2="455" stroke="#ca8a04"/>
  </g>

  <!-- Port labels -->
  <g font-size="11.5" font-weight="600" fill="#111827">
    <rect x="360" y="270" width="46" height="18" rx="4" fill="#fff" stroke="#9ca3af"/><text x="383" y="283" text-anchor="middle">Fa0/1</text>
    <rect x="428" y="294" width="46" height="18" rx="4" fill="#fff" stroke="#9ca3af"/><text x="451" y="307" text-anchor="middle">Fa0/2</text>
    <rect x="526" y="294" width="46" height="18" rx="4" fill="#fff" stroke="#9ca3af"/><text x="549" y="307" text-anchor="middle">Fa0/3</text>
    <rect x="594" y="270" width="46" height="18" rx="4" fill="#fff" stroke="#9ca3af"/><text x="617" y="283" text-anchor="middle">Fa0/4</text>

    <rect x="162" y="428" width="36" height="18" rx="4" fill="#fff" stroke="#9ca3af"/><text x="180" y="441" text-anchor="middle">Fa0</text>
    <rect x="344" y="428" width="36" height="18" rx="4" fill="#fff" stroke="#9ca3af"/><text x="362" y="441" text-anchor="middle">Fa0</text>
    <rect x="612" y="428" width="36" height="18" rx="4" fill="#fff" stroke="#9ca3af"/><text x="630" y="441" text-anchor="middle">Fa0</text>
    <rect x="794" y="428" width="36" height="18" rx="4" fill="#fff" stroke="#9ca3af"/><text x="812" y="441" text-anchor="middle">Fa0</text>
  </g>

  <!-- Router -->
  <g filter="url(#shadow)">
    <rect x="440" y="80" width="120" height="60" rx="12" fill="url(#devGrad)"/>
    <circle cx="470" cy="110" r="14" fill="none" stroke="#e5e7eb" stroke-width="2.5"/>
    <path d="M462 110h16M470 102v16" stroke="#e5e7eb" stroke-width="2.5"/>
    <text x="520" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">R1</text>
    <text x="520" y="123" text-anchor="middle" font-size="11" fill="#d1d5db">Cisco 2911</text>
  </g>

  <!-- Switch -->
  <g filter="url(#shadow)">
    <rect x="410" y="220" width="180" height="52" rx="10" fill="url(#devGrad)"/>
    <g fill="#9ca3af">
      <rect x="426" y="256" width="8" height="8" rx="1"/><rect x="440" y="256" width="8" height="8" rx="1"/>
      <rect x="454" y="256" width="8" height="8" rx="1"/><rect x="468" y="256" width="8" height="8" rx="1"/>
      <rect x="482" y="256" width="8" height="8" rx="1"/><rect x="496" y="256" width="8" height="8" rx="1"/>
      <rect x="510" y="256" width="8" height="8" rx="1"/><rect x="524" y="256" width="8" height="8" rx="1"/>
    </g>
    <text x="500" y="240" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">SW1</text>
    <text x="500" y="253" text-anchor="middle" font-size="10.5" fill="#d1d5db">Catalyst 2960-24TT</text>
  </g>

  <!-- PCs -->
  <g filter="url(#shadow)">
    <use href="#pc" x="130" y="490"/>
    <use href="#pc" x="350" y="490"/>
    <use href="#pc" x="650" y="490"/>
    <use href="#pc" x="870" y="490"/>
  </g>
  <g font-size="13" font-weight="700" fill="#111827" text-anchor="middle">
    <text x="130" y="540">PC1</text>
    <text x="350" y="540">PC4</text>
    <text x="650" y="540">PC2</text>
    <text x="870" y="540">PC3</text>
  </g>

  <!-- Legend -->
  <g font-size="12" fill="#374151">
    <line x1="60" y1="634" x2="90" y2="634" stroke="#dc2626" stroke-width="4"/><text x="98" y="638">Trunk</text>
    <line x1="170" y1="634" x2="200" y2="634" stroke="#0284c7" stroke-width="3"/><text x="208" y="638">Access VLAN 10</text>
    <line x1="330" y1="634" x2="360" y2="634" stroke="#ca8a04" stroke-width="3"/><text x="368" y="638">Access VLAN 20</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
